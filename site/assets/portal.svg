<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 52">
  <!-- Horazon's portal, lit and turning (web/src/components/Portal.tsx, state "live"). -->
  <style>
    .s { transform-box: fill-box; transform-origin: center; animation: t 9s linear infinite; }
    .r { animation-duration: 14s; animation-direction: reverse; }
    @keyframes t { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .s { animation: none; } }
  </style>
  <defs>
    <radialGradient id="c" cx="50%" cy="55%" r="55%">
      <stop offset="0" stop-color="#d6e3ff"/>
      <stop offset="0.45" stop-color="#5b82ff"/>
      <stop offset="1" stop-color="#1d2f8a"/>
    </radialGradient>
    <clipPath id="k"><ellipse cx="20" cy="26" rx="14" ry="20"/></clipPath>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>
  <ellipse cx="20" cy="26" rx="16" ry="22" fill="none" stroke="#5b82ff" stroke-width="3" opacity="0.55" filter="url(#g)"/>
  <ellipse cx="20" cy="26" rx="14" ry="20" fill="url(#c)"/>
  <g clip-path="url(#k)" fill="none" stroke="#d6e3ff" stroke-linecap="round">
    <circle class="s" cx="20" cy="27" r="11" stroke-opacity="0.55" stroke-width="1.6" stroke-dasharray="14 9 5 12"/>
    <circle class="s r" cx="20" cy="25" r="6.5" stroke-opacity="0.7" stroke-width="1.3" stroke-dasharray="8 6 3 8"/>
  </g>
  <ellipse cx="20" cy="26" rx="15" ry="21" fill="none" stroke="#9dbcff" stroke-width="2.2"/>
</svg>
